server {
    server_name nadiaglavin.com;

    root /var/www/nadia/public;
    index index.php index.html;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    charset utf-8;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(env|log|sql|bak|sh)$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/nadiaglavin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nadiaglavin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nadiaglavin.com;

    ssl_certificate /etc/letsencrypt/live/nadiaglavin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nadiaglavin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nadiaglavin.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nadia.owlsolutions.net;

    ssl_certificate /etc/letsencrypt/live/nadia.owlsolutions.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nadia.owlsolutions.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nadiaglavin.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nadiaglavin.com www.nadiaglavin.com nadia.owlsolutions.net;

    return 301 https://nadiaglavin.com$request_uri;
}
